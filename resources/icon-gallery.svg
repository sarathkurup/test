<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Gallery icon. Same railway points motif as the activity bar glyph, but
       with its own colour, since this one is never tinted by the theme. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="8">
    <!-- The route not taken, dimmed. -->
    <path d="M42 64c22 0 26-26 48-26h22" stroke="#475569"/>
    <!-- The live route. -->
    <path d="M18 64h24" stroke="url(#active)"/>
    <path d="M42 64c22 0 26 26 48 26h22" stroke="url(#active)"/>
  </g>

  <!-- The switch itself. -->
  <circle cx="42" cy="64" r="11" fill="#0b1220"/>
  <circle cx="42" cy="64" r="11" fill="none" stroke="#22d3ee" stroke-width="6"/>
</svg>
